neweix24@gmail <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neweix Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { margin-top: 0; text-align: center; }
    p { color: #666; text-align: center; }
    label { display: block; margin-top: 18px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
    }
    #message { margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Neweix Admin</h1>
    <p>অ্যাডমিন অ্যাকাউন্টে লগইন করুন</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password"
        type="password" autocomplete="current-password"
        required>

      <button type="submit">Login</button>
      <div id="message" role="status"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "লগইন যাচাই হচ্ছে...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent =
            data.error || "লগইন করা যায়নি। আবার চেষ্টা করুন।";
          return;
        }

        window.location.href = "/admin-dashboard.html";
      } catch {
        message.textContent =
          "সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
      }
    });
  </script>
</body>
</html>
