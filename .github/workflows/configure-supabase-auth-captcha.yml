name: Configure Supabase Auth CAPTCHA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-supabase-auth-captcha.yml

permissions:
  contents: read

concurrency:
  group: supabase-auth-captcha-config
  cancel-in-progress: false

jobs:
  configure-auth-captcha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_CAPTCHA_SECRET: ${{ secrets.SUPABASE_AUTH_CAPTCHA_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_AUTH_CAPTCHA_SECRET" || { echo "::error::Missing SUPABASE_AUTH_CAPTCHA_SECRET repository secret"; exit 1; }

      - name: Enable Turnstile in Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_CAPTCHA_SECRET: ${{ secrets.SUPABASE_AUTH_CAPTCHA_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PATCH \
            --url 'https://api.supabase.com/v1/projects/grhybvlhdnzlopwbaqun/config/auth' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg secret "$SUPABASE_AUTH_CAPTCHA_SECRET" '{
              security_captcha_enabled: true,
              security_captcha_provider: "turnstile",
              security_captcha_secret: $secret
            }')")"

          if [ "$status" != "200" ]; then
            echo "::error::Supabase Auth CAPTCHA configuration failed (HTTP $status). Response follows with secrets redacted by omission."
            jq -c 'del(.security_captcha_secret)' "$response_file" 2>/dev/null || echo "Supabase returned a non-JSON error response."
            exit 1
          fi

          enabled="$(jq -r '.security_captcha_enabled // false' "$response_file")"
          provider="$(jq -r '.security_captcha_provider // "unknown"' "$response_file")"
          test "$enabled" = "true"
          test "$provider" = "turnstile"
          echo "Supabase Auth CAPTCHA enabled: $enabled; provider: $provider"
