name: Supabase database migration tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-tests-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migrations:
    name: Apply all migrations on disposable local PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Start disposable PostgreSQL with non-database services excluded
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply every SQL migration in order without version-table collisions
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14})_.*/\1/' | sort | uniq -d)"
          if [ -n "$duplicate_versions" ]; then
            echo "::error::Duplicate migration version(s): $duplicate_versions"
            exit 1
          fi
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Run EixPay, EixVerse and integrity-chain smoke tests
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/eixpay_integrity_smoke_test.sql

      - name: Verify customer phone verification grants
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/customer_phone_verification_grants_test.sql

      - name: Verify queue lease RPC privilege boundaries
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/queue_lease_fencing_privileges_test.sql

      - name: Verify partial-return restock ledger permissions
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/partial_return_restock_privileges_test.sql

      - name: Verify customer return request privilege boundaries
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/customer_return_requests_privileges_test.sql

      - name: Verify EixPay daily watchdog permissions
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/eixpay_watchdog_privileges_test.sql

      - name: Verify terminal order states and one-time cancellation restocking
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/order_status_transition_smoke_test.sql

      - name: Verify order rate limits and atomic Pathao status transitions
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/order_rate_limit_pathao_atomic_test.sql

      - name: Verify 180-day customer device data retention
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/customer_device_retention_test.sql

      - name: Verify customer in-app notification permissions
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/customer_in_app_notifications_test.sql

      - name: Verify workforce identity formats and server-only access
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/workforce_identity_security_test.sql

      - name: Verify multi-warehouse stock and privilege boundaries
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/multi_warehouse_foundation_test.sql

      # GitHub-hosted runners are ephemeral; Docker containers are discarded after the job.
