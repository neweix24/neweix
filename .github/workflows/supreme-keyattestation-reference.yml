name: Supreme Android Key Attestation reference verifier

on:
  push:
    branches:
      - feat/supreme-server-attestation-verifier
    paths:
      - ".github/workflows/supreme-keyattestation-reference.yml"
      - "docs/security/SUPREME_ANDROID_ATTESTATION_VERIFIER.md"
      - "scripts/security/**"
      - "supabase/functions/_shared/supreme-android-keydescription*"
      - "supabase/functions/_shared/supreme-attestation-application-id*"\n      - "supabase/functions/_shared/supreme-attestation-der*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/supreme-keyattestation-reference.yml"
      - "docs/security/SUPREME_ANDROID_ATTESTATION_VERIFIER.md"
      - "scripts/security/**"
      - "supabase/functions/_shared/supreme-android-keydescription*"
      - "supabase/functions/_shared/supreme-attestation-application-id*"
      - "supabase/functions/_shared/supreme-attestation-der*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-keyattestation-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out pinned upstream verifier source
        env:
          UPSTREAM_COMMIT: "0e3ac2fdd54799d779e1979a96fbcba0361b2089"
        run: |
          set -euo pipefail
          git init android-keyattestation
          cd android-keyattestation
          git remote add origin https://github.com/android/keyattestation.git
          git fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Run upstream verifier test suite
        working-directory: android-keyattestation
        run: ./gradlew --no-daemon --stacktrace test

      - name: Set up Deno for real-certificate parser differential tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Extract real Android attestation extensions from upstream PEM fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/supreme-attestation-classes
          javac -d /tmp/supreme-attestation-classes scripts/security/ExtractAndroidAttestationFixtures.java
          java -cp /tmp/supreme-attestation-classes ExtractAndroidAttestationFixtures \
            android-keyattestation /tmp/supreme-attestation-fixtures.json

      - name: Compare Deno parser with real Android certificate fixture outputs
        env:
          SUPREME_ATTESTATION_FIXTURE_INDEX: /tmp/supreme-attestation-fixtures.json
          SUPREME_ATTESTATION_UPSTREAM_DIR: android-keyattestation
        run: |
          deno test --allow-env=SUPREME_ATTESTATION_FIXTURE_INDEX,SUPREME_ATTESTATION_UPSTREAM_DIR \
            --allow-read=android-keyattestation,/tmp/supreme-attestation-fixtures.json \
            supabase/functions/_shared/supreme-android-keydescription_fixture_test.ts
