name: Deploy NEWEIX to Cloudflare Workers

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('neweix-cloudflare-pr-{0}', github.event.pull_request.number) || 'neweix-cloudflare-production' }}
  cancel-in-progress: false

jobs:
  validate-cloudflare-build:
    if: github.event_name == 'pull_request'
    name: Validate OpenNext Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://grhybvlhdnzlopwbaqun.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyaHlidmxoZG56bG9wd2JhcXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDYyMjEsImV4cCI6MjEwODIyMjIyMX0.27nR0VFbxwVYQKb5A06BRwizp02CHAmoD9IRMwiJ0Ss
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare Worker
        run: npx opennextjs-cloudflare build

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 8ac926e7573e6b45edab34c3346b366c
      NEXT_PUBLIC_SUPABASE_URL: https://grhybvlhdnzlopwbaqun.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyaHlidmxoZG56bG9wd2JhcXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDYyMjEsImV4cCI6MjEwODIyMjIyMX0.27nR0VFbxwVYQKb5A06BRwizp02CHAmoD9IRMwiJ0Ss
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Verify matching CI and migration tests succeeded
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const required = ["CI", "Supabase database migration tests"];
            for (const workflowName of required) {
              let matched = false;
              for (let attempt = 0; attempt < 36; attempt += 1) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: "main",
                  per_page: 100
                });
                const run = data.workflow_runs
                  .filter(item => item.name === workflowName && item.head_sha === sha)
                  .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];
                if (run?.conclusion === "success") {
                  matched = true;
                  core.info(`${workflowName} succeeded for ${sha}`);
                  break;
                }
                if (run && ["failure", "cancelled", "timed_out", "action_required"].includes(run.conclusion)) {
                  core.setFailed(`${workflowName} did not succeed for ${sha}: ${run.conclusion}`);
                  return;
                }
                core.info(`Waiting for ${workflowName} on ${sha} (attempt ${attempt + 1}/36)`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (!matched) {
                core.setFailed(`No successful ${workflowName} run found for ${sha}; deployment blocked.`);
                return;
              }
            }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare Worker
        run: npx opennextjs-cloudflare build

      # OpenNext's deploy wrapper first requests a temporary edge-preview proxy
      # from Cloudflare. That remote preview-token endpoint intermittently fails
      # with error 10013/timeouts in this CI account. This app has no remote
      # OpenNext cache bindings (R2/KV/D1/DO queue) configured, so after the
      # supported OpenNext build, deploy its generated worker directly with
      # Wrangler using the checked-in worker.ts and .open-next/assets config.
      - name: Deploy generated Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
