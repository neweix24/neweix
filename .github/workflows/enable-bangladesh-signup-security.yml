name: Enable Bangladesh Signup Security

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-bangladesh-signup-security.yml

permissions:
  contents: read

concurrency:
  group: enable-bangladesh-signup-security
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate Supabase Management API token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Generate and store signed webhook secret
        id: hook-secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          hook_secret="v1,whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$hook_secret"

          # The CLI writes the secret to Supabase Edge Function environment
          # without printing its value. Supabase CLI reads SUPABASE_ACCESS_TOKEN.
          npx --yes supabase@latest secrets set \
            --project-ref grhybvlhdnzlopwbaqun \
            "BEFORE_USER_CREATED_HOOK_SECRET=$hook_secret"

          echo "secret=$hook_secret" >> "$GITHUB_OUTPUT"

      - name: Enable and verify Supabase Before User Created hook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOOK_SECRET: ${{ steps.hook-secret.outputs.secret }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          hook_url="https://grhybvlhdnzlopwbaqun.supabase.co/functions/v1/before-user-created"

          payload="$(jq -n \
            --arg uri "$hook_url" \
            --arg secret "$HOOK_SECRET" \
            '{
              hook_before_user_created_enabled: true,
              hook_before_user_created_uri: $uri,
              hook_before_user_created_secrets: $secret
            }')"

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PATCH \
            --url 'https://api.supabase.com/v1/projects/grhybvlhdnzlopwbaqun/config/auth' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload")"

          if [[ "$status" != "200" ]]; then
            echo "::error::Supabase Auth hook configuration failed (HTTP $status). Response body withheld."
            exit 1
          fi

          jq -e \
            --arg uri "$hook_url" \
            '.hook_before_user_created_enabled == true and .hook_before_user_created_uri == $uri' \
            "$response_file" >/dev/null

          echo "Verified: Before User Created hook is enabled and points to the deployed Edge Function."
          echo "Strict signup policy is now wired to the active Bangladesh/VPN verification function."
