<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supreme Login - Neweix</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1b1913; margin: 0; color: #fff; }
    .box { background: #26231c; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 85%; max-width: 340px; border: 1px solid #37332a; }
    h2 { text-align: center; color: #4cc59a; margin-bottom: 20px; font-size: 22px; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #1b1913; border: 1px solid #37332a; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
    input:focus { border-color: #4cc59a; }
    button { width: 100%; padding: 14px; background: #4cc59a; color: #111; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #msg { text-align: center; margin-top: 15px; font-size: 14px; color: #ef7b6e; min-height: 20px; }
    #dashboard { display: none; text-align: center; }
    .badge { background: #4cc59a; color: #111; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="box" id="login-box">
    <h2>👑 Supreme Access</h2>
    <input id="email" type="email" placeholder="Supreme Email">
    <input id="pass" type="password" placeholder="Password">
    <button id="btn" onclick="handleLogin()">লগইন করুন</button>
    <div id="msg"></div>
  </div>

  <div class="box" id="dashboard">
    <h2>Supreme Panel</h2>
    <span class="badge">SUPREME ADMIN</span>
    <p style="color:#a39e92; font-size:14px; margin-top:15px;">আপনি সফলভাবে লগইন করেছেন!</p>
    <button onclick="handleLogout()" style="background:#c0392b; color:#fff; margin-top:20px;">লগআউট</button>
  </div>

  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');

      if(!email || !pass) { msg.innerText = 'ইমেইল ও পাসওয়ার্ড দিন'; return; }

      msg.innerText = 'যাচাই করা হচ্ছে...';
      msg.style.color = '#fff';
      btn.disabled = true;

      try {
        // এখানে আপনার ব্যাকএন্ড API-তে কল করা হচ্ছে
        const res = await fetch('/api/supreme-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.innerText = data.error || 'লগইন ব্যর্থ হয়েছে';
          msg.style.color = '#ef7b6e';
          btn.disabled = false;
          return;
        }

        // সফল হলে টোকেন সেভ করে ড্যাশবোর্ড দেখাও
        localStorage.setItem('supreme_token', data.token);
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

      } catch (err) {
        msg.innerText = 'সার্ভারের সাথে সংযোগ হচ্ছে না!';
        msg.style.color = '#ef7b6e';
        btn.disabled = false;
      }
    }

    function handleLogout() {
      localStorage.removeItem('supreme_token');
      location.reload();
    }
  </script>
</body>
</html>
