<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Neweix Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  margin: 0;
  padding: 16px;
  color: #222;
}

main {
  max-width: 760px;
  margin: auto;
}

section {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

h1, h2, h3 {
  overflow-wrap: anywhere;
}

h1 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  padding: 12px 18px;
  margin-top: 16px;
  background: #111;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#message, #status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.product-card {
  border: 1px solid #e2e2e2;
  padding: 15px;
  margin: 14px 0;
  border-radius: 10px;
  background: #fff;
  overflow-wrap: anywhere;
}

.product-image {
  width: 100%;
  max-width: 260px;
  max-height: 260px;
  object-fit: contain;
  display: block;
  margin-bottom: 12px;
  border-radius: 8px;
}

.product-card p {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.muted {
  color: #666;
  font-size: 14px;
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  section {
    padding: 15px;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>
<main>

<section>
  <h1>Neweix Admin</h1>
  <p id="status">লগইন যাচাই হচ্ছে...</p>
</section>

<section id="dashboard" hidden>

  <h2>নতুন পণ্য যোগ করুন</h2>

  <form id="productForm">

    <label for="name">পণ্যের নাম *</label>
    <input id="name" name="name"
      required maxlength="200">

    <label for="description">পণ্যের বিস্তারিত বিবরণ</label>
    <textarea id="description" name="description"
      maxlength="10000"
      placeholder="পণ্যের বৈশিষ্ট্য ও বিস্তারিত লিখুন"></textarea>

    <label for="price">দাম (টাকা) *</label>
    <input id="price" name="price"
      type="number" min="0" step="0.01" required>

    <label for="image_url">পণ্যের ছবির HTTPS লিংক</label>
    <input id="image_url" name="image_url"
      type="url" placeholder="https://example.com/image.jpg">

    <label for="category">ক্যাটাগরি</label>
    <input id="category" name="category"
      maxlength="100" placeholder="যেমন: Tech & Accessories">

    <label for="stock">স্টকের পরিমাণ *</label>
    <input id="stock" name="stock"
      type="number" min="0" step="1" value="0" required>

    <button id="submitButton" type="submit">
      পণ্য যোগ করুন
    </button>

    <p id="message" role="status" aria-live="polite"></p>
  </form>

  <hr>

  <h2>পণ্যের তালিকা</h2>
  <p class="muted">এখানে সংরক্ষিত পণ্যের বিস্তারিত দেখা যাবে।</p>

  <button id="reload" type="button">
    তালিকা রিফ্রেশ
  </button>

  <div id="products" aria-live="polite"></div>

</section>
</main>

<script>
"use strict";

const dashboard = document.getElementById("dashboard");
const statusEl = document.getElementById("status");
const message = document.getElementById("message");
const productsBox = document.getElementById("products");
const productForm = document.getElementById("productForm");
const submitButton = document.getElementById("submitButton");
const reloadButton = document.getElementById("reload");

async function apiRequest(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options
  });

  const data = await response.json().catch(() => ({}));

  if (response.status === 401 || response.status === 403) {
    location.replace("/admin.html");
    throw new Error("লগইন মেয়াদ শেষ। আবার লগইন করুন।");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "অনুরোধ সম্পন্ন হয়নি।");
  }

  return data;
}

async function start() {
  try {
    const data = await apiRequest("/api/admin/verify");

    if (data.authenticated !== true) {
      location.replace("/admin.html");
      return;
    }

    statusEl.hidden = true;
    dashboard.hidden = false;

    await loadProducts();

  } catch (error) {
    statusEl.textContent =
      "লগইন যাচাই করা যায়নি: " + error.message;
  }
}

function addText(parent, tag, text, className = "") {
  const element = document.createElement(tag);
  element.textContent = text;

  if (className) {
    element.className = className;
  }

  parent.appendChild(element);
  return element;
}

function renderProduct(p) {
  const item = document.createElement("article");
  item.className = "product-card";

  if (p.image_url) {
    try {
      const imageUrl = new URL(p.image_url);

      if (imageUrl.protocol === "https:") {
        const img = document.createElement("img");
        img.className = "product-image";
        img.src = imageUrl.href;
        img.alt = p.name || "পণ্যের ছবি";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        item.appendChild(img);
      }
    } catch {
      // ভুল ছবির URL হলে ছবি দেখানো হবে না।
    }
  }

  addText(item, "h3", p.name || "নাম নেই");

  addText(
    item,
    "p",
    "দাম: ৳" + (p.price ?? 0)
  );

  addText(
    item,
    "p",
    "বিস্তারিত: " +
      (p.description || "বিবরণ দেওয়া হয়নি")
  );

  addText(
    item,
    "p",
    "ক্যাটাগরি: " +
      (p.category || "নির্ধারিত নয়")
  );

  addText(
    item,
    "p",
    "স্টক: " + (p.stock ?? 0)
  );

  return item;
}

async function loadProducts() {
  productsBox.textContent = "পণ্য লোড হচ্ছে...";
  reloadButton.disabled = true;

  try {
    const data = await apiRequest("/api/products");

    if (!Array.isArray(data.products)) {
      throw new Error("পণ্যের তালিকার তথ্য সঠিক নয়।");
    }

    productsBox.replaceChildren();

    if (data.products.length === 0) {
      productsBox.textContent = "এখনো কোনো পণ্য নেই।";
      return;
    }

    data.products.forEach(product => {
      productsBox.appendChild(renderProduct(product));
    });

  } catch (error) {
    productsBox.textContent =
      "পণ্য লোড করা যায়নি: " + error.message;

  } finally {
    reloadButton.disabled = false;
  }
}

productForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (!productForm.reportValidity()) {
    return;
  }

  submitButton.disabled = true;
  message.textContent = "পণ্য যোগ হচ্ছে...";

  const formData = new FormData(productForm);

  const payload = {
    name: String(formData.get("name") || "").trim(),
    description: String(
      formData.get("description") || ""
    ).trim(),
    price: String(formData.get("price") || ""),
    image_url: String(
      formData.get("image_url") || ""
    ).trim(),
    category: String(
      formData.get("category") || ""
    ).trim(),
    stock: Number(formData.get("stock") || 0)
  };

  try {
    if (payload.image_url) {
      const imageUrl = new URL(payload.image_url);

      if (imageUrl.protocol !== "https:") {
        throw new Error(
          "ছবির লিংক অবশ্যই HTTPS হতে হবে।"
        );
      }
    }

    if (!Number.isFinite(payload.stock) ||
        payload.stock < 0 ||
        !Number.isInteger(payload.stock)) {
      throw new Error("স্টকের পরিমাণ সঠিকভাবে লিখুন।");
    }

    const price = Number(payload.price);

    if (!Number.isFinite(price) || price < 0) {
      throw new Error("সঠিক পণ্যমূল্য লিখুন।");
    }

    const data = await apiRequest("/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    message.textContent =
      data.message || "সফল! পণ্য যোগ হয়েছে।";

    productForm.reset();
    productForm.elements.stock.value = 0;

    await loadProducts();

  } catch (error) {
    message.textContent =
      "পণ্য যোগ করা যায়নি: " + error.message;

  } finally {
    submitButton.disabled = false;
  }
});

reloadButton.addEventListener("click", loadProducts);

start();
</script>
</body>
</html>
