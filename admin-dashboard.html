<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neweix Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f5f7;
      color: #222;
    }
    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
    }
    #status { color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>Neweix Admin</h1>
    <p id="status">লগইন যাচাই হচ্ছে...</p>
    <section id="dashboard" hidden>
      <h2>স্বাগতম!</h2>
      <p>তোমার অ্যাডমিন পেজ প্রস্তুত হচ্ছে।</p>
      <p>পরবর্তী ধাপে পণ্য পরিচালনার সুবিধা যোগ করা হবে।</p>
    </section>
  </main>

  <script>
    async function checkLogin() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("/api/admin/verify", {
          credentials: "same-origin"
        });

        if (!response.ok) {
          window.location.replace("/admin.html");
          return;
        }

        const data = await response.json();

        if (data.authenticated !== true) {
          window.location.replace("/admin.html");
          return;
        }

        status.hidden = true;
        document.getElementById("dashboard").hidden = false;
      } catch {
        status.textContent =
          "যাচাই করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করো।";
      }
    }

    checkLogin();
  </script>
</body>
</html>
