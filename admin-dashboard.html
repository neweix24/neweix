<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Neweix Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  margin: 0;
  padding: 16px;
  color: #222;
}

main {
  max-width: 760px;
  margin: auto;
}

section {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

h1, h2, h3 {
  overflow-wrap: anywhere;
}

h1 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  padding: 12px 18px;
  margin-top: 16px;
  background: #111;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#message, #status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.product-card {
  border: 1px solid #e2e2e2;
  padding: 15px;
  margin: 14px 0;
  border-radius: 10px;
  background: #fff;
  overflow-wrap: anywhere;
}

.product-image {
  width: 100%;
  max-width: 260px;
  max-height: 260px;
  object-fit: contain;
  display: block;
  margin-bottom: 12px;
  border-radius: 8px;
}

.product-card p {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.muted {
  color: #666;
  font-size: 14px;
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  section {
    padding: 15px;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>
<main>

<section>
  <h1>Neweix Admin</h1>
  <p id="status">লগইন যাচাই হচ্ছে...</p>
</section>

<section id="dashboard" hidden>

  <h2>নতুন পণ্য যোগ করুন</h2>

  <form id="productForm">

    <label for="name">পণ্যের নাম *</label>
    <input id="name" name="name"
      required maxlength="200">

    <label for="description">পণ্যের বিস্তারিত বিবরণ</label>
    <textarea id="description" name="description"
      maxlength="10000"
      placeholder="পণ্যের বৈশিষ্ট্য ও বিস্তারিত লিখুন"></textarea>

    <label for="price">দাম (টাকা) *</label>
    <input id="price" name="price"
      type="number" min="0" step="0.01" required>

    <label for="image_url">পণ্যের ছবির HTTPS লিংক</label>
    <input id="image_url" name="image_url"
      type="url" placeholder="https://example.com/image.jpg">

    <label for="category">ক্যাটাগরি</label>
    <input id="category" name="category"
      maxlength="100" placeholder="যেমন: Tech & Accessories">

    <label for="stock">স্টকের পরিমাণ *</label>
    <input id="stock" name="stock"
      type="number" min="0" step="1" value="0" required>

    <button id="submitButton" type="submit">
      পণ্য যোগ করুন
    </button>

    <p id="message" role="status" aria-live="polite"></p>
  </form>

  <hr>

  <h2>পণ্যের তালিকা</h2>
  <p class="muted">এখানে সংরক্ষিত পণ্যের বিস্তারিত দেখা যাবে।</p>

  <button id="reload" type="button">
    তালিকা রিফ্রেশ
  </button>

  <div id="products" aria-live="polite"></div>

</section>
</main>

<script>
"use strict";

const dashboard = document.getElementById("dashboard");
const statusEl = document.getElementById("status");
const message = document.getElementById("message");
const productsBox = document.getElementById("products");
const productForm = document.getElementById("productForm");
const submitButton = document.getElementById("submitButton");
const reloadButton = document.getElementById("reload");

let editingId = null;

const cancelButton = document.createElement("button");
cancelButton.type = "button";
cancelButton.textContent = "সম্পাদনা বাতিল";
cancelButton.hidden = true;
submitButton.insertAdjacentElement("afterend", cancelButton);

async function apiRequest(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options
  });

  const data = await response.json().catch(() => ({}));

  if (response.status === 401 || response.status === 403) {
    location.replace("/admin.html");
    throw new Error("আবার Admin Login করুন।");
  }

  if (!response.ok) {
    throw new Error(data.error || "অনুরোধ সম্পন্ন হয়নি।");
  }

  return data;
}

async function start() {
  try {
    const data = await apiRequest("/api/admin/verify");

    if (data.authenticated !== true) {
      location.replace("/admin.html");
      return;
    }

    statusEl.hidden = true;
    dashboard.hidden = false;
    await loadProducts();
  } catch (error) {
    statusEl.textContent = "লগইন যাচাই করা যায়নি: " + error.message;
  }
}

function addText(parent, tag, text, className = "") {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  parent.appendChild(element);
  return element;
}

function makeButton(parent, label, action) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.addEventListener("click", action);
  parent.appendChild(button);
  return button;
}

function renderProduct(p) {
  const item = document.createElement("article");
  item.className = "product-card";

  if (p.image_url) {
    try {
      const url = new URL(p.image_url);
      if (url.protocol === "https:") {
        const img = document.createElement("img");
        img.className = "product-image";
        img.src = url.href;
        img.alt = p.name || "পণ্যের ছবি";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        item.appendChild(img);
      }
    } catch {}
  }

  addText(item, "h3", p.name || "নাম নেই");
  addText(item, "p", "দাম: ৳" + (p.price ?? 0));
  addText(item, "p", "বিবরণ: " + (p.description || "নেই"));
  addText(item, "p", "ক্যাটাগরি: " + (p.category || "নির্ধারিত নয়"));
  addText(item, "p", "স্টক: " + (p.stock ?? 0));

  makeButton(item, "✏️ সম্পাদনা", () => editProduct(p));
  makeButton(item, "🗑️ ডিলিট", () => deleteProduct(p));

  return item;
}

async function loadProducts() {
  productsBox.textContent = "পণ্য লোড হচ্ছে...";
  reloadButton.disabled = true;

  try {
    const data = await apiRequest("/api/products");

    if (!Array.isArray(data.products)) {
      throw new Error("পণ্যের তালিকা সঠিক নয়।");
    }

    productsBox.replaceChildren();

    if (data.products.length === 0) {
      productsBox.textContent = "এখনো কোনো পণ্য নেই।";
      return;
    }

    data.products.forEach(p => {
      productsBox.appendChild(renderProduct(p));
    });
  } catch (error) {
    productsBox.textContent = "পণ্য লোড করা যায়নি: " + error.message;
  } finally {
    reloadButton.disabled = false;
  }
}

function editProduct(p) {
  editingId = p.id;

  productForm.elements.name.value = p.name || "";
  productForm.elements.description.value = p.description || "";
  productForm.elements.price.value = p.price ?? "";
  productForm.elements.image_url.value = p.image_url || "";
  productForm.elements.category.value = p.category || "";
  productForm.elements.stock.value = p.stock ?? 0;

  submitButton.textContent = "পরিবর্তন সংরক্ষণ করুন";
  cancelButton.hidden = false;
  message.textContent = "পণ্যের তথ্য পরিবর্তন করে সংরক্ষণ করুন।";

  document.getElementById("name").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function resetEdit() {
  editingId = null;
  productForm.reset();
  productForm.elements.stock.value = 0;
  submitButton.textContent = "পণ্য যোগ করুন";
  cancelButton.hidden = true;
  message.textContent = "";
}

cancelButton.addEventListener("click", resetEdit);
reloadButton.addEventListener("click", loadProducts);

async function deleteProduct(p) {
  if (!confirm('"' + p.name + '" পণ্যটি স্থায়ীভাবে ডিলিট করবেন?')) {
    return;
  }

  try {
    const data = await apiRequest(
      "/api/products/" + encodeURIComponent(p.id),
      { method: "DELETE" }
    );

    message.textContent = data.message || "পণ্য ডিলিট হয়েছে।";
    if (String(editingId) === String(p.id)) resetEdit();
    await loadProducts();
  } catch (error) {
    message.textContent = "ডিলিট করা যায়নি: " + error.message;
  }
}

productForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (!productForm.reportValidity()) return;

  submitButton.disabled = true;
  cancelButton.disabled = true;
  message.textContent = editingId === null
    ? "পণ্য যোগ হচ্ছে..."
    : "পরিবর্তন সংরক্ষণ হচ্ছে...";

  const formData = new FormData(productForm);

  const payload = {
    name: String(formData.get("name") || "").trim(),
    description: String(formData.get("description") || "").trim(),
    price: String(formData.get("price") || ""),
    image_url: String(formData.get("image_url") || "").trim(),
    category: String(formData.get("category") || "").trim(),
    stock: Number(formData.get("stock"))
  };

  try {
    const price = Number(payload.price);

    if (!payload.name || !Number.isFinite(price) || price < 0) {
      throw new Error("পণ্যের নাম ও সঠিক দাম দিন।");
    }

    if (!Number.isSafeInteger(payload.stock) || payload.stock < 0) {
      throw new Error("স্টকের সঠিক সংখ্যা দিন।");
    }

    if (payload.image_url) {
      const url = new URL(payload.image_url);
      if (url.protocol !== "https:") {
        throw new Error("ছবির লিংক অবশ্যই HTTPS হতে হবে।");
      }
    }

    const isEditing = editingId !== null;
    const url = isEditing
      ? "/api/products/" + encodeURIComponent(editingId)
      : "/api/products";

    const data = await apiRequest(url, {
      method: isEditing ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    message.textContent = data.message ||
      (isEditing ? "পণ্য আপডেট হয়েছে।" : "পণ্য যোগ হয়েছে।");

    resetEdit();
    await loadProducts();
  } catch (error) {
    message.textContent = "সমস্যা: " + error.message;
  } finally {
    submitButton.disabled = false;
    cancelButton.disabled = false;
  }
});

start();
</script>
</body>
</html>
