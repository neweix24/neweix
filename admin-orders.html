<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Neweix অর্ডার</title>
<style>body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;padding:12px}main{max-width:760px;margin:auto}.o{background:#fff;padding:14px;margin:12px 0;border-radius:10px;overflow-wrap:anywhere}.o p{white-space:pre-line;margin:6px 0}select,input,button{padding:10px;margin:4px 4px 0 0;font:inherit}button{background:#111;color:#fff;border:0;border-radius:6px}button:disabled{opacity:.5}</style></head>
<body><main><h1>অর্ডার তালিকা</h1><p><a href="/admin-dashboard.html">← পণ্য ম্যানেজমেন্ট</a> <button id="lo">লগআউট</button></p><p id="st">লোড হচ্ছে...</p><div id="list"></div></main>
<script>
const S=['Pending','Confirmed','Shipped','Delivered','Cancelled'],P=['Pending','Paid'];
const e=(t,x)=>{const n=document.createElement(t);if(x!=null)n.textContent=x;return n};
async function api(u,o){const r=await fetch(u,{credentials:'same-origin',...o});if(r.status===401){location.replace('/admin.html');throw 0}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'ব্যর্থ');return d}
function sel(opts,v){const s=document.createElement('select');opts.forEach(o=>{const x=e('option',o);x.value=o;if(o===v)x.selected=true;s.append(x)});return s}
async function load(){const d=await api('/api/orders'),l=document.getElementById('list');l.replaceChildren();
document.getElementById('st').textContent=d.orders.length?'':'এখনো কোনো অর্ডার নেই';
d.orders.forEach(o=>{const c=e('div');c.className='o';let it=[];try{it=JSON.parse(o.items)}catch{}
c.append(e('b','#'+o.id+' — '+o.customer_name),e('p','📞 '+o.phone+'\n📍 '+o.address),e('p',it.map(i=>i.name+' ×'+i.qty).join(', ')),e('p','মোট ৳'+o.total_amount+' (ডেলিভারি ৳'+o.delivery_charge+') · '+o.created_at));
const a=sel(S,o.order_status),b=sel(P,o.payment_status),t=e('input');t.placeholder='কুরিয়ার ট্র্যাকিং ID';t.value=o.courier_tracking_id||'';
const s=e('button','সংরক্ষণ');s.onclick=async()=>{try{await api('/api/orders/'+o.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_status:a.value,payment_status:b.value,courier_tracking_id:t.value})});s.textContent='✔ সেভ হয়েছে'}catch(x){alert(x.message)}};
const pb=e('button',o.courier_tracking_id?'Pathao ✔':'Pathao-তে পাঠান');pb.disabled=!!o.courier_tracking_id;pb.onclick=async()=>{pb.disabled=true;try{const d=await api('/api/pathao/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.id})});t.value=d.consignment_id;pb.textContent='Pathao ✔'}catch(x){alert(x.message);pb.disabled=false}};
c.append(a,b,t,s,pb);l.append(c)})}
document.getElementById('lo').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.replace('/admin.html')};
load().catch(x=>{if(x)document.getElementById('st').textContent=x.message});
</script></body></html>
